<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f6f8">
  <meta name="description" content="九九乘法练习，听题目，用数字键盘答题。">
  <title>九九乘法练习</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <header><h1>九九乘法</h1><button id="sound-toggle" type="button" aria-label="声音" aria-pressed="false" hidden>声音：关</button></header>
    <section class="practice" aria-label="乘法练习">
      <div class="question-zone">
        <div class="card-top"><span id="round-label">准备开始</span><span id="phase-label">等你开始</span></div>
        <div class="equation" aria-label="题目"><span id="factor-a">?</span><span class="symbol">×</span><span id="factor-b">?</span><span class="symbol">=</span><span id="result-value">?</span></div>
        <div class="question-bottom"><p id="question-hint">点击开始练习</p><button id="replay" disabled hidden>再听一遍</button></div>
      </div>
      <div class="feedback" id="feedback" role="status" aria-live="polite">
        <strong id="feedback-title">准备好了吗？</strong>
        <p id="feedback-detail">点击“开始练习”，每题有三次机会。</p>
      </div>
      <div class="play-controls">
        <button id="start" class="primary-button"><span id="start-icon" hidden></span><span id="start-text">开始练习</span></button>
      </div>
      <div class="input-area">
        <div class="input-label"><label for="answer">答案</label><div class="attempts"><span>剩余</span><strong id="attempt-count">3 次</strong><div id="chances" hidden><i></i><i></i><i></i></div></div></div>
        <form id="answer-form" autocomplete="off">
          <input id="answer" type="text" inputmode="numeric" enterkeyhint="done" maxlength="3" pattern="[0-9]*" placeholder="输入答案" aria-label="答案" disabled>
          <button id="submit" type="submit" disabled>提交</button>
        </form>
        <div class="keypad" id="keypad" aria-label="数字键盘">
          <button data-digit="1" disabled>1</button><button data-digit="2" disabled>2</button><button data-digit="3" disabled>3</button>
          <button data-digit="4" disabled>4</button><button data-digit="5" disabled>5</button><button data-digit="6" disabled>6</button>
          <button data-digit="7" disabled>7</button><button data-digit="8" disabled>8</button><button data-digit="9" disabled>9</button>
          <button id="clear" class="key-secondary" disabled>清空</button><button data-digit="0" disabled>0</button><button id="backspace" class="key-secondary" aria-label="删除最后一位" disabled>删除</button>
        </div>
      </div>
    </section>
    <div class="stats" aria-label="练习统计">
      <span>答对 <strong id="correct-count">0</strong></span>
      <span>完成 <strong id="completed-count">0</strong></span>
      <span>连对 <strong id="streak-count">0</strong></span>
    </div>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
